<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1a3a5c" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Fox OS" />
  <title>Fox OS</title>
  <script>
    try {
      var t = localStorage.getItem('foxos.theme.v1');
      var ok = { modern: 1, 'liquid-glass': 1, 'frutiger-aero': 1 };
      if (t && ok[t]) document.documentElement.dataset.theme = t;
      else if (t && t !== 'classic') document.documentElement.removeAttribute('data-theme');
      var colors = { classic: '#1a3a5c', modern: '#eef1f6', 'liquid-glass': '#d4e4f7', 'frutiger-aero': '#bfe4f8' };
      var m = document.querySelector('meta[name="theme-color"]');
      if (m) m.setAttribute('content', colors[ok[t] ? t : 'classic'] || colors.classic);
    } catch (e) { /* */ }
  </script>
  <link rel="stylesheet" href="static/style.css?v=340" />
  <link rel="stylesheet" href="static/themes.css?v=340" />
  <link rel="stylesheet" href="static/vendor/xterm/xterm.css?v=330" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ctext y='50' font-size='48'%3E🦊%3C/text%3E%3C/svg%3E" />
</head>
<body>
  <div id="boot" class="boot">
    <div class="boot-card">
      <div class="boot-fox">🦊</div>
      <div class="boot-title">Fox OS</div>
      <div class="boot-sub">Starting desktop…</div>
      <div class="boot-bar"><i></i></div>
    </div>
  </div>

  <div id="desktop" class="desktop hidden" aria-label="Fox OS desktop">
    <div class="wallpaper" aria-hidden="true">
      <img class="wallpaper-img" id="wallpaperImg" alt="" decoding="async" draggable="false" />
    </div>
    <aside id="widgets" class="desk-widgets" aria-label="Desktop widgets"></aside>
    <div id="icons" class="desktop-icons"></div>
    <div id="windows" class="windows"></div>
    <div id="snapGuide" class="snap-guide hidden" aria-hidden="true"></div>

    <header id="mobileStatusBar" class="mobile-statusbar" aria-label="Status bar">
      <span id="mClock" class="m-clock">--:--</span>
      <span id="mHost" class="m-host"></span>
      <span class="m-stats">
        <span id="mCpu" class="m-stat">CPU —</span>
        <span id="mMem" class="m-stat">RAM —</span>
      </span>
    </header>

    <nav id="mobileDock" class="mobile-dock" role="navigation" aria-label="App dock">
      <button type="button" class="dock-btn" data-dock="home"><span class="dock-ico">🏠</span><span class="dock-lbl">Home</span></button>
      <button type="button" class="dock-btn" data-dock="files"><span class="dock-ico">📁</span><span class="dock-lbl">Files</span></button>
      <button type="button" class="dock-btn" data-dock="system"><span class="dock-ico">🖥</span><span class="dock-lbl">System</span></button>
      <button type="button" class="dock-btn" data-dock="terminal"><span class="dock-ico">⌨</span><span class="dock-lbl">Terminal</span></button>
      <button type="button" class="dock-btn" data-dock="more"><span class="dock-ico">⋯</span><span class="dock-lbl">More</span></button>
    </nav>

    <footer class="taskbar" role="navigation">
      <button type="button" class="start-btn" id="startBtn" aria-haspopup="true" aria-expanded="false">
        <span class="start-fox">🦊</span> Start
      </button>
      <div class="task-tabs" id="taskTabs"></div>
      <div class="tray">
        <span id="trayCpu" class="tray-stat tray-meter" title="CPU"><i id="trayCpuBar"></i><span>CPU —</span></span>
        <span id="trayMem" class="tray-stat tray-meter" title="Memory"><i id="trayMemBar"></i><span>RAM —</span></span>
        <span id="trayTemp" class="tray-stat" title="CPU temperature">—</span>
        <span id="trayDisk" class="tray-stat" title="Disk free">—</span>
        <span id="trayHost" class="tray-host"></span>
        <span id="clock" class="clock"></span>
      </div>
    </footer>

    <div id="startMenu" class="start-menu hidden" role="menu">
      <div class="start-side">Fox<span>OS</span></div>
      <div class="start-main">
        <div class="start-search-wrap">
          <input type="search" id="startSearch" class="start-search" placeholder="Search apps & bookmarks…" autocomplete="off" spellcheck="false" />
        </div>
        <div class="start-items" id="startItems"></div>
      </div>
    </div>
  </div>

  <template id="tpl-window">
    <div class="win" data-win="">
      <div class="win-titlebar">
        <span class="win-ico"></span>
        <span class="win-title"></span>
        <div class="win-controls">
          <button type="button" class="win-min" title="Minimize">_</button>
          <button type="button" class="win-max" title="Maximize">□</button>
          <button type="button" class="win-close" title="Close">×</button>
        </div>
      </div>
      <div class="win-body"></div>
    </div>
  </template>

  <script src="static/vendor/xterm/xterm.min.js?v=330"></script>
  <script src="static/vendor/xterm/addon-fit.min.js?v=330"></script>
  <script src="static/app.js?v=340"></script>
</body>
</html>
