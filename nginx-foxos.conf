# Fox OS — include from weatherfox or main site
# Example: location /foxos/ { ... }

location /foxos/ {
    proxy_pass         http://127.0.0.1:8765/;
    proxy_http_version 1.1;
    proxy_set_header   Host $host;
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    client_max_body_size 64m;
}

# Terminal PTY WebSocket (side listener; Waitress does not speak WS).
# Only needed when allow_terminal=true. Default listen: 127.0.0.1:8766
# NPM / Caddy: enable WebSocket support for this path the same way.
location /foxos/ws/terminal {
    proxy_pass         http://127.0.0.1:8766/;
    proxy_http_version 1.1;
    proxy_set_header   Upgrade $http_upgrade;
    proxy_set_header   Connection "upgrade";
    proxy_set_header   Host $host;
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}

